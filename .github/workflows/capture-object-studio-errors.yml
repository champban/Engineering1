name: Capture Object Studio type diagnostics

on:
  push:
    branches:
      - feature/phase2-equipment-engineering

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - name: Capture TypeScript output
        continue-on-error: true
        run: npm run typecheck > TYPE_ERRORS.txt 2>&1
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TYPE_ERRORS.txt
          git commit -m "chore: capture Object Studio type diagnostics [skip ci]" || exit 0
          git push
