name: Apply Phase 1B layout increment

on:
  push:
    branches:
      - feature/phase1a-camera-gallery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Apply layout editor increment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          layout_b64 = ""
          css_b64 = ""
          test_b64 = ""

          def unpack(value):
              return gzip.decompress(base64.b64decode(value)).decode()

          page_path = Path('src/ui/pages/WorkspacePage.tsx')
          text = page_path.read_text()
          text = text.replace(
              "  buildConnectedRoute,\n  connectedRoutePolyline,\n  conveyorPathPolyline,\n",
              "  buildConnectedRoute,\n  canvasPointToWorld,\n  connectedRoutePolyline,\n  conveyorPathPolyline,\n",
          )
          text = text.replace(
              "  createLayoutProject,\n  createSceneInstance,\n",
              "  createLayoutProject,\n  createSceneInstance,\n  duplicateSceneInstance,\n  evaluateConveyorConnections,\n",
          )
          text = text.replace(
              "  sampleConnectedRoute,\n  sampleConveyorPath,\n",
              "  reorderConveyor,\n  sampleConnectedRoute,\n  sampleConveyorPath,\n",
          )
          start = text.index('function LayoutWorkspace({')
          end = text.index('\nfunction RuntimeWorkspace(', start)
          text = text[:start] + unpack(layout_b64) + text[end:]
          page_path.write_text(text)

          css_path = Path('src/ui/pages/workspace.css')
          css = css_path.read_text()
          marker = '.layout-grid-control {'
          if marker not in css:
              css_path.write_text(css.rstrip() + '\n' + unpack(css_b64))

          Path('src/test/unit/phase1b-layout.test.ts').write_text(unpack(test_b64))
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - name: Verify increment
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit increment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/pages/WorkspacePage.tsx src/ui/pages/workspace.css src/test/unit/phase1b-layout.test.ts
          git commit -m "feat: add Phase 1B drag, snap, and conveyor sequencing"
          git push
