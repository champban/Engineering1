name: Finalize Object Studio integration

on:
  push:
    branches:
      - feature/phase2-equipment-engineering

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Wait for earlier one-time jobs
        run: sleep 20
      - name: Refresh branch and finalize files
        run: |
          git fetch origin feature/phase2-equipment-engineering
          git reset --hard origin/feature/phase2-equipment-engineering
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/main.tsx')
          text = path.read_text()
          text = re.sub(r"type AppMode = .*", "type AppMode = 'phase1' | 'phase2' | 'studio'", text, count=1)
          path.write_text(text)
          PY
          git rm -f --ignore-unmatch \
            .github/workflows/apply-object-studio.yml \
            .github/workflows/fix-object-studio-types.yml \
            .github/workflows/capture-object-studio-errors.yml \
            .github/workflows/remove-object-studio-unused-import.yml \
            .github/workflows/commit-object-studio-integration.yml \
            .github/workflows/cleanup-object-studio-temp.yml \
            .github/workflows/finalize-object-studio.yml \
            scripts/apply-object-studio.mjs \
            scripts/fix-object-studio-types.mjs \
            TYPE_ERRORS.txt
      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: finalize Object Studio integration [skip ci]"
          git push
