name: Apply Phase 1A 3D Gallery increment

on:
  push:
    branches:
      - feature/phase1a-camera-gallery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - name: Apply reviewed workspace files
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > src/ui/pages/WorkspacePage.tsx
          echo '' | base64 -d | gzip -d > src/ui/pages/workspace.css
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify increment
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit reviewed increment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/ui/pages/WorkspacePage.tsx src/ui/pages/workspace.css
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat: add interactive 3D Gallery review [skip ci]"
          git push
