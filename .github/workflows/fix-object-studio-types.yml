name: Fix Object Studio types

on:
  push:
    branches:
      - feature/phase2-equipment-engineering

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - run: node scripts/apply-object-studio.mjs
      - run: node scripts/fix-object-studio-types.mjs
      - run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
      - name: Commit verified fixes
        run: |
          if git diff --quiet; then
            echo "No Object Studio fixes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/ui/pages/ObjectStudioPage.tsx src/viewport/components/ObjectStudioViewport.tsx
          git commit -m "fix: verify Object Studio editor integration [skip ci]"
          git push
