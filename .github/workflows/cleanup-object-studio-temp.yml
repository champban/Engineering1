name: Clean temporary Object Studio automation

on:
  push:
    branches:
      - feature/phase2-equipment-engineering

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove temporary automation and diagnostics
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/apply-object-studio.yml \
            .github/workflows/fix-object-studio-types.yml \
            .github/workflows/capture-object-studio-errors.yml \
            .github/workflows/remove-object-studio-unused-import.yml \
            .github/workflows/commit-object-studio-integration.yml \
            .github/workflows/cleanup-object-studio-temp.yml \
            scripts/apply-object-studio.mjs \
            scripts/fix-object-studio-types.mjs \
            TYPE_ERRORS.txt
      - name: Commit cleanup
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary Object Studio automation [skip ci]"
          git push
