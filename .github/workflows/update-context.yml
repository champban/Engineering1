name: Update Engineering1 context

on:
  push:
    branches:
      - Doc

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Update project context
        shell: python
        run: |
          from pathlib import Path
          path = Path('PROJECT_CONTEXT.md')
          text = path.read_text()

          replacements = {
              "Current branch head: `685e4dd67cba2f0efc0adeaf525b62183afa1ea2`": "Current branch head: `f5796653e3f65db166f8ed489eb8b8206fabd4e4`",
              "- Calibratable visual 3D proxy.\n": "- Calibratable visual 3D proxy.\n- Lazy-loaded direct Three.js preview with orbit, pan/zoom controls, engineering-proportion proxy geometry, and generated GLB loading.\n- GLB load failure/CORS fallback to a calibrated proxy and rendered-image reference.\n",
              "- Reusable Object Gallery with search.\n": "- Reusable Object Gallery with search.\n- Gallery 3D inspector, asset duplication, deletion, and Draft → Calibrated transition.\n",
              "- Unit tests for Gallery records, capability states, and transport paths.\n": "- Unit tests for Gallery records, capability states, transport paths, lifecycle helpers, and 3D preview proportion normalization.\n",
              "- Unit tests: 58/58 Passed, including nine new Phase 1 tests.\n": "- Unit tests: 61/61 Passed.\n",
              "- Build output: HTML 0.62 kB, CSS 13.25 kB, JavaScript 220.07 kB.\n": "- Production build uses code splitting: main application JavaScript 223.47 kB and lazy Three.js preview chunk 588.90 kB before gzip.\n",
              "- GitHub Actions Quality Gate run #3: Passed.\n": "- GitHub Actions Quality Gate run #26 on commit `f5796653e3f65db166f8ed489eb8b8206fabd4e4`: Passed.\n",
              "- A headless-browser screenshot/smoke attempt hung in the current runtime. Browser interaction is therefore not yet marked Verified.\n": "- P'Boy opened the deployed static preview successfully and confirmed the Phase 1 workspace shell rendered correctly. Full end-to-end object capture, Gallery, layout, and runtime acceptance remains pending.\n",
              "- Automatic source upload was attempted after a fresh successful local typecheck, lint, 58/58 tests, and production build.\n- The Netlify MCP uploader downloaded successfully, but its authenticated upload request failed with `TypeError: fetch failed` from the current runtime.\n- The site therefore has no verified live deployment yet.\n": "- Static preview deployment is live and Netlify reports deploy state `ready`.\n- Current live static deploy ID: `6a5ef317f8efcc78c652b2d0`.\n- P'Boy opened the site and verified the workspace shell visually.\n- The live static deploy does not include Netlify Functions or live AI because the project is not yet connected to the feature branch and `FAL_KEY` is not configured.\n",
              "- Verified in an interactive browser: No, pending.\n": "- Verified in an interactive browser: Partially; live shell verified, full workflow pending.\n",
              "- Deployed: No; the dedicated site exists but contains no verified deploy.\n": "- Deployed: Static acceptance preview is live; Functions-enabled AI deployment is pending.\n",
              "1. Upload the static preview package to the dedicated Phase 1 Netlify project for UI/manual-fallback acceptance, or connect the feature branch for a Functions-enabled build.\n2. Perform real-browser acceptance for upload, selection, manual environment removal, Gallery save, layout insertion, and conveyor Runtime.\n3. Configure `FAL_KEY` only in the isolated preview site's server environment.\n4. Deploy the full source with Netlify Functions enabled.\n5. Test AI segmentation and AI reconstruction with a real object.\n6. Render the generated GLB directly inside the engineering viewport and verify scale/orientation.\n": "1. Perform full real-browser acceptance for upload, selection, manual environment removal, 3D proxy review, Gallery save/duplicate/delete/calibrate, layout insertion, and conveyor Runtime.\n2. Connect the Netlify project to `feature/phase1a-camera-gallery` so Functions are built from source.\n3. Configure `FAL_KEY` only in the isolated preview site's server environment.\n4. Test AI segmentation, generated GLB loading, orbit review, scale calibration, and save-to-Gallery using a real object.\n5. Verify cross-origin loading for provider-hosted GLB assets; use a server proxy or object storage adapter if direct CORS fails.\n",
              "- Add object deletion, renaming, duplication, categories, folders, and gallery import/export.\n": "- Add object renaming, category management, folders, revision history, and Gallery import/export.\n",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected context text: {old[:100]}')
              text = text.replace(old, new)

          path.write_text(text)
      - name: Commit context update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_CONTEXT.md
          git commit -m "docs: record Phase 1A interactive 3D Gallery increment [skip ci]"
          git push
