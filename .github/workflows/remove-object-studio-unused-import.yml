name: Remove Object Studio unused import

on:
  push:
    branches:
      - feature/phase2-equipment-engineering

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Remove unused React import
        run: sed -i 's/useCallback, useEffect, useMemo, useRef/useCallback, useEffect, useRef/' src/ui/pages/ObjectStudioPage.tsx
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/pages/ObjectStudioPage.tsx
          git commit -m "fix: remove unused Object Studio import [skip ci]"
          git push
