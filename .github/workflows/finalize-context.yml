name: Finalize Engineering1 context

on:
  push:
    branches:
      - Doc

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Finalize current head and quality run
        shell: python
        run: |
          from pathlib import Path
          path = Path('PROJECT_CONTEXT.md')
          text = path.read_text()
          text = text.replace('Current branch head: `f5796653e3f65db166f8ed489eb8b8206fabd4e4`', 'Current branch head: `e1c862225a65dc3565b51147f538f66fe525ec21`')
          text = text.replace('GitHub Actions Quality Gate run #26 on commit `f5796653e3f65db166f8ed489eb8b8206fabd4e4`: Passed.', 'GitHub Actions Quality Gate run #30 on commit `e1c862225a65dc3565b51147f538f66fe525ec21`: Passed.')
          path.write_text(text)
      - name: Commit final context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_CONTEXT.md
          git commit -m "docs: finalize Phase 1A 3D Gallery status [skip ci]"
          git push
