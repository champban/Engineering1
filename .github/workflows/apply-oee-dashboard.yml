name: Apply OEE dashboard increment
on:
  push:
    branches: [feature/phase1a-camera-gallery]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - run: node scripts/apply-oee-dashboard.mjs
      - run: npm ci && npm run typecheck && npm run lint && npm test && npm run build
      - run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add src/ui/pages/WorkspacePage.tsx src/ui/pages/workspace.css
          git commit -m "feat: add OEE and waste dashboard [skip ci]"
          git push
