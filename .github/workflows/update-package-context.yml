name: Update Phase 1 package context

on:
  push:
    branches:
      - Doc

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Update package records
        shell: python
        run: |
          from pathlib import Path
          path = Path('PROJECT_CONTEXT.md')
          text = path.read_text()
          replacements = {
            '- Static preview package: `Engineering1-Phase1A-1C-preview-dist.zip`.': '- Updated static preview package: `Engineering1-Phase1A-3D-Gallery-preview-dist.zip`.',
            '- Static preview SHA-256: `846365dab348a3e1772b61055c6a80dee2da645f9972037d599c3a6d4f20f96c`.': '- Updated static preview SHA-256: `d66880c14cfaed77bce67161bba1469240b057a26bedeba223a629183051d92b`.',
            '- Full source/functions package: `Engineering1-Phase1A-1C-source.zip`.': '- Updated full source/functions package: `Engineering1-Phase1A-3D-Gallery-source.zip`.',
            '- Full source SHA-256: `37b18c092980f4e3acfa8c401184ea2348047be25f97294f861fd2c4867af40f`.': '- Updated full source SHA-256: `a360eefd3429a1821f9fc4d327b95f83a2cce800b8734c4131a85a51cbdd89c9`.',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing expected line: {old}')
            text = text.replace(old, new)
          path.write_text(text)
      - name: Commit updated package context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_CONTEXT.md
          git commit -m "docs: record updated Phase 1A 3D Gallery packages [skip ci]"
          git push
