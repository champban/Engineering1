/* =====================================================================
   Render dispatch
   ===================================================================== */
const RENDERERS = {
  overview: renderOverview, timeline: renderTimeline, weekly: renderWeekly,
  lines: renderLines, daily: renderDaily, readiness: renderReadiness,
  notes: renderNotes, changes: renderChanges,
};

function render() {
  for (const tab of TABS) {
    const el = $('#view-' + tab.id);
    const active = tab.id === state.view;
    el.classList.toggle('active', active);
    if (active) el.innerHTML = RENDERERS[tab.id]();
  }
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === state.view)));
  const badge = $('#change-badge');
  badge.hidden = state.patches.size === 0;
  badge.textContent = String(state.patches.size);
}

/* =====================================================================
   Editing — every edit is a patch against a {sheet, cell} address, which
   is what lets the Excel export be surgical rather than a regeneration.
   ===================================================================== */
const LS_KEY = 'weekly-project-plan.patches.v1';
let storageBroken = false;

function cellValue(sheet, ref) {
  const sh = state.book.sheets[sheet];
  const c = sh && sh.cells[ref];
  return c == null ? '' : String(c.v);
}
function setCellValue(sheet, ref, value) {
  const sh = state.book.sheets[sheet];
  if (!sh) return;
  if (value === '') delete sh.cells[ref];
  else sh.cells[ref] = { v: value, t: 's' };
}

function applyPatch(sheet, ref, after) {
  const key = patchKey(sheet, ref);
  const existing = state.patches.get(key);
  const before = existing ? existing.before : cellValue(sheet, ref);
  if (after === before) state.patches.delete(key);
  else state.patches.set(key, { sheet, ref, before, after });
  setCellValue(sheet, ref, after);
  state.model = buildModel(state.book);
  persistPatches();
  render();
}

function undoPatch(key) {
  const p = state.patches.get(key);
  if (!p) return;
  setCellValue(p.sheet, p.ref, p.before);
  state.patches.delete(key);
  state.model = buildModel(state.book);
  persistPatches();
  render();
}

function discardAllPatches() {
  for (const p of state.patches.values()) setCellValue(p.sheet, p.ref, p.before);
  state.patches.clear();
  state.model = buildModel(state.book);
  persistPatches();
  render();
  toast('All changes discarded.');
}

function bookSignature() {
  return state.sourceName + ':' + state.book.order.map(n => Object.keys(state.book.sheets[n].cells).length).join('/');
}
function persistPatches() {
  if (storageBroken) return;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ sig: state.signature, patches: Array.from(state.patches.values()) }));
  } catch (err) {
    storageBroken = true;
    toast('This browser will not keep edits after a reload — export to Excel before closing.', true);
  }
}
function restorePatches() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); }
  catch (err) { return; }
  if (!saved || !Array.isArray(saved.patches) || !saved.patches.length) return;
  if (saved.sig !== state.signature) return;   // a different workbook — do not graft old edits onto it
  for (const p of saved.patches) {
    state.patches.set(patchKey(p.sheet, p.ref), p);
    setCellValue(p.sheet, p.ref, p.after);
  }
  state.model = buildModel(state.book);
}

function beginEdit(el) {
  if (el.querySelector('textarea')) return;
  const sheet = el.dataset.sheet, ref = el.dataset.ref;
  const before = cellValue(sheet, ref);
  const prevHtml = el.innerHTML;

  el.innerHTML = '';
  const ta = document.createElement('textarea');
  ta.className = 'editor';
  ta.value = before;
  ta.setAttribute('aria-label', `Edit ${sheet} ${ref}`);
  const hint = document.createElement('div');
  hint.className = 'editor-hint';
  hint.textContent = `${sheet} · ${ref} — Ctrl+Enter to save, Esc to cancel`;
  el.append(ta, hint);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);

  let done = false;
  const cancel = () => { if (done) return; done = true; el.innerHTML = prevHtml; };
  const commit = () => {
    if (done) return;
    done = true;
    const after = ta.value.replace(/\r\n/g, '\n');
    if (after === before) { el.innerHTML = prevHtml; return; }
    applyPatch(sheet, ref, after);
  };

  ta.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commit(); }
  });
  ta.addEventListener('blur', commit);
}

/* =====================================================================
   Excel export — patch the original workbook bytes, never regenerate.
   Untouched parts are copied through byte-for-byte, so fills, column
   widths, merges and every sheet we do not edit survive exactly.
   ===================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function dosDateTime(d = new Date()) {
  const time = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31);
  const date = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
  return { time, date };
}

/** entries: [{name, method, crc, usize, data}] — data already in its stored form. */
function buildZip(entries) {
  const enc = new TextEncoder();
  const { time, date } = dosDateTime();
  const locals = [], centrals = [];
  let offset = 0;

  for (const e of entries) {
    const name = enc.encode(e.name);
    const lh = new Uint8Array(30 + name.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);          // UTF-8 filenames
    dv.setUint16(8, e.method, true);
    dv.setUint16(10, time, true);
    dv.setUint16(12, date, true);
    dv.setUint32(14, e.crc, true);
    dv.setUint32(18, e.data.length, true);
    dv.setUint32(22, e.usize, true);
    dv.setUint16(26, name.length, true);
    dv.setUint16(28, 0, true);
    lh.set(name, 30);

    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, e.method, true);
    cv.setUint16(12, time, true);
    cv.setUint16(14, date, true);
    cv.setUint32(16, e.crc, true);
    cv.setUint32(20, e.data.length, true);
    cv.setUint32(24, e.usize, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);

    locals.push(lh, e.data);
    centrals.push(ch);
    offset += lh.length + e.data.length;
  }

  const cdSize = centrals.reduce((n, c) => n + c.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);

  const parts = locals.concat(centrals, [eocd]);
  const total = parts.reduce((n, p) => n + p.length, 0);
  const out = new Uint8Array(total);
  let at = 0;
  for (const p of parts) { out.set(p, at); at += p.length; }
  return out;
}

async function sheetPathMap(zip) {
  const wbText = await entryText(zip, 'xl/workbook.xml');
  const relsText = await entryText(zip, 'xl/_rels/workbook.xml.rels');
  const rels = new Map();
  if (relsText) {
    for (const r of xmlDoc(relsText).getElementsByTagName('Relationship')) {
      let target = r.getAttribute('Target') || '';
      if (target.startsWith('/')) target = target.slice(1);
      else if (!target.startsWith('xl/')) target = 'xl/' + target.replace(/^\.\//, '');
      rels.set(r.getAttribute('Id'), target);
    }
  }
  const map = new Map();
  for (const sh of xmlDoc(wbText).getElementsByTagName('sheet')) {
    const rid = sh.getAttributeNS(REL_NS, 'id') || sh.getAttribute('r:id');
    map.set(sh.getAttribute('name'), rels.get(rid));
  }
  return map;
}

const XML_NS = 'http://www.w3.org/XML/1998/namespace';

function insertOrdered(parent, node, key, keyOf) {
  let before = null;
  for (const child of Array.from(parent.children)) {
    if (keyOf(child) > key) { before = child; break; }
  }
  parent.insertBefore(node, before);
}

/** Copy the style index of the nearest cell in the same column, so a value
 *  typed into a previously-empty cell inherits that column's formatting. */
function inheritStyle(sheetData, col, row) {
  for (const r of Array.from(sheetData.children)) {
    for (const c of Array.from(r.children)) {
      const pos = parseRef(c.getAttribute('r') || '');
      if (pos && pos.col === col && c.hasAttribute('s')) return c.getAttribute('s');
    }
  }
  return null;
}

function patchSheetXml(xmlText, patches) {
  const doc = xmlDoc(xmlText);
  const sheetData = doc.getElementsByTagName('sheetData')[0];
  if (!sheetData) throw new Error('Worksheet has no sheetData element.');
  const ns = doc.documentElement.namespaceURI;

  const rowsByNum = new Map();
  for (const row of Array.from(sheetData.getElementsByTagName('row'))) {
    rowsByNum.set(+row.getAttribute('r'), row);
  }

  for (const p of patches) {
    const pos = parseRef(p.ref);
    if (!pos) continue;

    let row = rowsByNum.get(pos.row);
    if (!row) {
      row = doc.createElementNS(ns, 'row');
      row.setAttribute('r', String(pos.row));
      insertOrdered(sheetData, row, pos.row, el => +el.getAttribute('r'));
      rowsByNum.set(pos.row, row);
    }
    row.removeAttribute('spans');

    let cell = null;
    for (const cand of Array.from(row.getElementsByTagName('c'))) {
      if (cand.getAttribute('r') === p.ref) { cell = cand; break; }
    }
    if (!cell) {
      cell = doc.createElementNS(ns, 'c');
      cell.setAttribute('r', p.ref);
      const style = inheritStyle(sheetData, pos.col, pos.row);
      if (style != null) cell.setAttribute('s', style);
      insertOrdered(row, cell, pos.col, el => {
        const q = parseRef(el.getAttribute('r') || '');
        return q ? q.col : 0;
      });
    }

    while (cell.firstChild) cell.removeChild(cell.firstChild);
    if (p.after === '') {
      cell.removeAttribute('t');
    } else {
      cell.setAttribute('t', 'inlineStr');
      const is = doc.createElementNS(ns, 'is');
      const t = doc.createElementNS(ns, 't');
      t.setAttributeNS(XML_NS, 'xml:space', 'preserve');
      t.appendChild(doc.createTextNode(p.after));
      is.appendChild(t);
      cell.appendChild(is);
    }
  }
  return new XMLSerializer().serializeToString(doc);
}

async function exportXlsx() {
  if (!state.templateBytes || !state.templateBytes.length) {
    toast('No workbook to write into — load the .xlsx file first.', true);
    return;
  }
  const zip = parseZip(state.templateBytes);
  const paths = await sheetPathMap(zip);

  const bySheet = new Map();
  for (const p of state.patches.values()) {
    if (!bySheet.has(p.sheet)) bySheet.set(p.sheet, []);
    bySheet.get(p.sheet).push(p);
  }

  const rewritten = new Map();
  const enc = new TextEncoder();
  for (const [sheetName, patches] of bySheet) {
    const path = paths.get(sheetName);
    if (!path || !zip.has(path)) throw new Error(`Sheet "${sheetName}" is not in the workbook being exported.`);
    const xml = new TextDecoder('utf-8').decode(await entryBytes(zip.get(path)));
    rewritten.set(path, enc.encode(patchSheetXml(xml, patches)));
  }

  const entries = [];
  for (const e of zip.values()) {
    if (rewritten.has(e.name)) {
      const data = rewritten.get(e.name);
      entries.push({ name: e.name, method: 0, crc: crc32(data), usize: data.length, data });
    } else {
      entries.push({ name: e.name, method: e.method, crc: e.crc, usize: e.usize, data: e.data });
    }
  }

  const blob = new Blob([buildZip(entries)], {
    type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
  });
  const base = state.sourceName.replace(/\.xlsx?$/i, '') || 'Weekly_Project_Plan';
  downloadBlob(blob, `${base}_${new Date().toISOString().slice(0, 10)}.xlsx`);
  toast(`Exported ${state.patches.size} change${state.patches.size === 1 ? '' : 's'} into ${base}.xlsx`);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ------------------------------------------------------------- CSV export */
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv() {
  const view = state.view;
  let rows = [];
  if (view === 'daily' && state.model.daily) {
    rows.push(['Day', 'Date', 'Time', 'System', 'Activity', 'Owner', 'Output', 'Status']);
    for (const day of state.model.daily.days) {
      for (const a of day.activities) {
        rows.push([day.heading, a.dayValues.length && day.iso ? day.iso : '', a.time, a.system, a.activity, a.owner, a.output, (STATES[a.state] || STATES.other).label]);
      }
    }
  } else if (view === 'readiness') {
    rows.push(['Category', 'Group', 'Item', 'Detail', 'Status', 'Owner']);
    for (const r of state.model.readiness) rows.push([r.category, r.group, r.item, r.detail, r.status, r.owner]);
  } else if (view === 'changes') {
    rows.push(['Sheet', 'Cell', 'Before', 'After']);
    for (const p of state.patches.values()) rows.push([p.sheet, p.ref, p.before, p.after]);
  } else {
    rows.push(['Week', 'Date', 'Day', 'Line', 'Status', 'Milestone', 'Activity', 'Tags', 'Vendors', 'Remark', 'Cell']);
    for (const ld of filteredLineDays({ withContentOnly: true })) {
      rows.push([ld.weekLabel, ld.day.iso, ld.day.weekday, ld.line, STATES[ld.cell.state].label,
        ld.cell.milestone ? 'yes' : '', ld.cell.text, ld.cell.tags.join('; '), ld.cell.vendors.join('; '),
        ld.remark.text, ld.cell.ref]);
    }
  }
  const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  downloadBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }),
    `weekly-plan-${view}-${new Date().toISOString().slice(0, 10)}.csv`);
  toast(`Exported ${rows.length - 1} rows to CSV.`);
}

/* =====================================================================
   Chrome: toast, drawer, theme
   ===================================================================== */
let toastTimer = null;
function toast(message, isError = false) {
  const el = $('#toast');
  el.textContent = message;
  el.classList.toggle('error', !!isError);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), isError ? 7000 : 3200);
}

function openDrawer(title, html) {
  $('#drawer-title').textContent = title;
  $('#drawer-body').innerHTML = html;
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');
}
function closeDrawer() {
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
}

const THEME_KEY = 'weekly-project-plan.theme';
function applyTheme(theme) {
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  else document.documentElement.removeAttribute('data-theme');
}

/* =====================================================================
   Filter controls
   ===================================================================== */
function buildFilters() {
  const weeks = state.model.weeks;
  const from = $('#f-week-from'), to = $('#f-week-to');
  const opts = weeks.map(w => `<option value="${w.ord}">${esc(w.label)} · ${esc(fmtDate(w.days[0].iso))}</option>`).join('');
  from.innerHTML = opts;
  to.innerHTML = opts;
  if (weeks.length) {
    state.filters.weekFrom = state.filters.weekFrom ?? weeks[0].ord;
    state.filters.weekTo = state.filters.weekTo ?? weeks[weeks.length - 1].ord;
    from.value = String(state.filters.weekFrom);
    to.value = String(state.filters.weekTo);
  }

  $('#f-lines').innerHTML = state.model.lines.map(l =>
    `<button type="button" class="chip" data-line="${esc(l)}" aria-pressed="${state.filters.lines.has(l)}">${esc(l)}</button>`).join('');

  $('#f-states').innerHTML = STATE_ORDER.map(k => {
    const s = STATES[k];
    return `<button type="button" class="chip ${s.cls}" data-state="${k}" aria-pressed="${state.filters.states.has(k)}">`
      + `<span class="dot" style="background:var(--c)"></span>${esc(s.label)}</button>`;
  }).join('');
}

function resetFilters() {
  const weeks = state.model.weeks;
  state.filters.lines.clear();
  state.filters.states.clear();
  state.filters.q = '';
  state.filters.weekFrom = weeks.length ? weeks[0].ord : null;
  state.filters.weekTo = weeks.length ? weeks[weeks.length - 1].ord : null;
  $('#f-search').value = '';
  buildFilters();
  render();
}

/* =====================================================================
   Data loading
   ===================================================================== */
function base64ToBytes(b64) {
  const clean = b64.replace(/\s+/g, '');
  if (!clean) return new Uint8Array(0);
  const bin = atob(clean);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function adoptBook(book, sourceName, templateBytes, generated) {
  state.book = book;
  state.sourceName = sourceName;
  state.generated = generated || '';
  if (templateBytes && templateBytes.length) state.templateBytes = templateBytes;
  state.model = buildModel(book);
  state.signature = bookSignature();
  restorePatches();

  state.filters.weekFrom = null;
  state.filters.weekTo = null;
  state.filters.lines.clear();
  state.filters.states.clear();

  const cells = book.order.reduce((n, name) => n + Object.keys(book.sheets[name].cells).length, 0);
  $('#source-meta').textContent =
    `${sourceName} · ${book.order.length} sheets · ${cells} cells`
    + (state.generated ? ` · snapshot ${state.generated}` : '')
    + (state.templateBytes && state.templateBytes.length ? '' : ' · Excel export needs the .xlsx loaded');

  buildFilters();
  render();
}

function bootFromEmbedded() {
  const raw = $('#embedded-data').textContent.trim();
  const book = JSON.parse(raw);
  if (!book.order || !book.order.length) {
    $('#source-meta').textContent = 'No data embedded — use “Load Excel file”.';
    state.book = { order: [], sheets: {} };
    state.model = buildModel(state.book);
    buildFilters();
    render();
    return;
  }
  const template = base64ToBytes($('#embedded-template').textContent || '');
  adoptBook(book, book.sourceName || 'Weekly_Project_Plan.xlsx', template, book.generated);
}

async function loadFile(file) {
  const buf = await file.arrayBuffer();
  const book = await readXlsx(buf);
  state.patches.clear();
  adoptBook(book, file.name, new Uint8Array(buf), '');
  toast(`Loaded ${file.name} — ${book.order.length} sheets.`);
}

/* =====================================================================
   Wiring
   ===================================================================== */
function wire() {
  $('#tabs').innerHTML = TABS.map(t =>
    `<button type="button" class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === state.view}">${esc(t.label)}</button>`).join('');

  $('#tabs').addEventListener('click', e => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    state.view = tab.dataset.tab;
    render();
  });

  $('#f-week-from').addEventListener('change', e => {
    state.filters.weekFrom = +e.target.value;
    if (state.filters.weekTo != null && state.filters.weekTo < state.filters.weekFrom) {
      state.filters.weekTo = state.filters.weekFrom;
      $('#f-week-to').value = String(state.filters.weekTo);
    }
    render();
  });
  $('#f-week-to').addEventListener('change', e => {
    state.filters.weekTo = +e.target.value;
    if (state.filters.weekFrom != null && state.filters.weekFrom > state.filters.weekTo) {
      state.filters.weekFrom = state.filters.weekTo;
      $('#f-week-from').value = String(state.filters.weekFrom);
    }
    render();
  });

  const toggleChip = (set, value, btn) => {
    if (set.has(value)) set.delete(value); else set.add(value);
    btn.setAttribute('aria-pressed', String(set.has(value)));
    render();
  };
  $('#f-lines').addEventListener('click', e => {
    const btn = e.target.closest('[data-line]');
    if (btn) toggleChip(state.filters.lines, btn.dataset.line, btn);
  });
  $('#f-states').addEventListener('click', e => {
    const btn = e.target.closest('[data-state]');
    if (btn) toggleChip(state.filters.states, btn.dataset.state, btn);
  });

  let searchTimer = null;
  $('#f-search').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const value = e.target.value;
    searchTimer = setTimeout(() => { state.filters.q = value.trim(); render(); }, 160);
  });
  $('#btn-reset').addEventListener('click', resetFilters);

  $('#btn-load').addEventListener('click', () => $('#file-input').click());
  $('#file-input').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try { await loadFile(file); }
    catch (err) { console.error(err); toast(err.message || String(err), true); }
  });

  const runExport = async () => {
    if (!state.patches.size) { toast('No changes to export yet.'); return; }
    try { await exportXlsx(); }
    catch (err) { console.error(err); toast(err.message || String(err), true); }
  };
  $('#btn-export-xlsx').addEventListener('click', runExport);
  $('#btn-export-csv').addEventListener('click', exportCsv);
  $('#btn-print').addEventListener('click', () => window.print());

  $('#btn-theme').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (err) { /* ignore */ }
  });

  $('#drawer-close').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  document.querySelector('main').addEventListener('click', e => {
    const undo = e.target.closest('[data-undo]');
    if (undo) { undoPatch(undo.dataset.undo); return; }
    if (e.target.closest('#btn-discard')) { discardAllPatches(); return; }
    if (e.target.closest('#btn-export-xlsx-2')) { runExport(); return; }

    const gcell = e.target.closest('[data-detail-ref]');
    if (gcell) {
      const ref = gcell.dataset.detailRef, lineName = gcell.dataset.detailLine;
      const ld = state.model.lineDays.find(x => x.cell.ref === ref && x.line === lineName);
      if (ld) {
        const s = STATES[ld.cell.state];
        openDrawer(`${ld.line} · ${fmtDate(ld.day.iso)}`,
          `<dl>
            <dt>Week</dt><dd>${esc(ld.weekLabel)}</dd>
            <dt>Date</dt><dd>${esc(ld.day.iso)} (${esc(ld.day.weekday)})${ld.day.holiday ? ' · holiday' : ''}</dd>
            <dt>Status</dt><dd>${stateLabel(ld.cell.state)}${ld.cell.milestone ? ` <span class="tag ms">${MILESTONE_ICON} milestone</span>` : ''}</dd>
            <dt>Cell</dt><dd>${esc(ld.sheet)} · ${esc(ld.cell.ref)}</dd>
            <dt>Activity</dt><dd>${esc(ld.cell.text)}</dd>
            ${ld.cell.tags.length || ld.cell.vendors.length ? `<dt>Tags</dt><dd>${tagsHtml(ld.cell)}</dd>` : ''}
            ${ld.remark.text ? `<dt>Remark</dt><dd>${esc(ld.remark.text)}</dd>` : ''}
          </dl>
          <p style="margin-top:14px"><button class="btn" data-edit="text" data-sheet="${esc(ld.sheet)}" data-ref="${esc(ld.cell.ref)}">Edit this cell</button></p>`);
      }
      return;
    }

    const editable = e.target.closest('[data-edit]');
    if (editable && !e.target.closest('textarea')) beginEdit(editable);
  });

  window.addEventListener('beforeunload', e => {
    if (state.patches.size && storageBroken) { e.preventDefault(); e.returnValue = ''; }
  });
}

/* =====================================================================
   Start
   ===================================================================== */
(function start() {
  try {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) applyTheme(saved);
  } catch (err) { /* file:// with storage disabled — fall back to the OS theme */ }

  wire();

  if (!HAS_INFLATE) {
    const btn = $('#btn-load');
    btn.disabled = true;
    btn.title = 'This browser cannot unzip .xlsx files. Use a current Chrome, Edge, Firefox or Safari.';
  }

  try {
    bootFromEmbedded();
  } catch (err) {
    console.error(err);
    $('#source-meta').textContent = 'Embedded data could not be read — use “Load Excel file”.';
    state.book = { order: [], sheets: {} };
    state.model = buildModel(state.book);
    buildFilters();
    render();
    toast(err.message || String(err), true);
  }
})();

</script>
